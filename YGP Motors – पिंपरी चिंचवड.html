<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YGP Motors – पिंपरी चिंचवड</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f4f1;--surface:#fff;--ink:#1b1f24;--muted:#5b636d;--line:#d9dbd6;--accent:#e4570f;--accent-ink:#fff;--ph:#e7e9e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--surface:#1e2227;--ink:#f1f2ee;--muted:#a3abb5;--line:#323840;--accent:#ff7a33;--accent-ink:#15181c;--ph:#2a3037;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--surface:#1e2227;--ink:#f1f2ee;--muted:#a3abb5;--line:#323840;--accent:#ff7a33;--accent-ink:#15181c;--ph:#2a3037;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:56rem;margin:0 auto;padding:0 1rem 5rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;border-bottom:3px solid var(--ink)}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}.logo span{color:var(--accent)}
.logo small{display:block;font-size:.75rem;font-weight:500;color:var(--muted);letter-spacing:0}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:.7rem 1.2rem;border-radius:.5rem;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:var(--ink);color:var(--bg)}
.tools{display:grid;gap:.75rem;padding:1rem 0}
input,select{font:inherit;padding:.7rem .8rem;border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink);width:100%}
.chips{display:flex;gap:.5rem;overflow-x:auto}
.chip{flex:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem 1rem;border-radius:2rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:.9rem;margin:0 0 .75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.ph{aspect-ratio:4/3;background:var(--ph);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:.65rem .75rem .8rem}
.price{font-weight:800;font-size:1.15rem}
.name{font-weight:600;margin:.1rem 0}
.meta{color:var(--muted);font-size:.85rem}
dialog{border:0;border-radius:.8rem;padding:0;width:min(34rem,94vw);max-height:90vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.5rem;border-radius:.5rem}.gal .ph{flex:none;width:100%;scroll-snap-align:center}
.dbody{padding:1.1rem}
.dbody h2{margin:.2rem 0 .3rem}
.close{float:right;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
form{display:grid;gap:.8rem}
label{display:grid;gap:.25rem;font-weight:600;font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.prev{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}.prev img{width:3.5rem;height:3.5rem;object-fit:cover;border-radius:.4rem}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.3);padding:.9rem 1.4rem;border-radius:3rem}
</style>
</head>
<body>
<main>
<div class="top"><div class="logo">YGP <span>Motors</span><small>पिंपरी चिंचवड · ग्राहक से ग्राहक</small></div></div>

<div class="tools">
<input id="q" type="search" placeholder="गाड़ी खोजें: Honda, Activa, Swift…" aria-label="खोजें">
<div class="chips" id="chips"></div>
</div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>

<button class="btn fab" id="sellBtn">+ गाड़ी बेचें</button>
</main>

<dialog id="detail"><div class="dbody" id="dbody"></div></dialog>

<dialog id="sell"><div class="dbody">
<button class="close" data-close aria-label="बंद करें">×</button>
<h2>अपनी गाड़ी डालें</h2>
<form id="f">
<label>गाड़ी का प्रकार<select id="type"><option>बाइक</option><option>स्कूटर</option><option>कार</option></select></label>
<div class="row"><label>कंपनी<input id="make" required placeholder="Honda"></label><label>मॉडल<input id="model" required placeholder="Activa"></label></div>
<div class="row"><label>साल<input id="year" required inputmode="numeric" placeholder="2019"></label><label>किलोमीटर<input id="km" required inputmode="numeric" placeholder="25000"></label></div>
<div class="row"><label>कीमत (₹)<input id="price" required inputmode="numeric" placeholder="45000"></label><label>इलाका<input id="area" required placeholder="Chinchwad"></label></div>
<label>फोन नंबर<input id="phone" required inputmode="tel" autocomplete="tel"></label>
<div><label for="photo" class="btn alt" style="display:block;cursor:pointer">📷 फोटो चुनें (8 तक)</label><input id="photo" class="vh" type="file" accept="image/*" multiple><p class="meta" id="pcount">कोई फोटो नहीं चुनी</p><div class="prev" id="prev"></div><p class="meta">बटन न खुले तो इस लिंक को Chrome में खोलिए।</p></div>
<button class="btn" type="submit">लिस्टिंग डालें</button>
</form></div></dialog>

<script>
var OWNER='919890177321';
var ICON={'बाइक':'🏍️','स्कूटर':'🛵','कार':'🚗'};
var base=[];
var mine=[];
try{mine=JSON.parse(localStorage.getItem('ygp-listings')||'[]')}catch(e){mine=[]}
var type='सभी';
var $=function(i){return document.getElementById(i)};
function inr(n){return '₹'+Number(n).toLocaleString('en-IN')}
function all(){return mine.concat(base)}
function thumb(v){var s=v.imgs&&v.imgs[0];return s?'<img alt="" src="'+s+'">':ICON[v.type]}
function gallery(v){var a=v.imgs||[];if(!a.length)return '<div class="ph" style="border-radius:.5rem">'+ICON[v.type]+'</div>';return '<div class="gal">'+a.map(function(s){return '<div class="ph"><img alt="" src="'+s+'"></div>'}).join('')+'</div>'+(a.length>1?'<p class="meta">'+a.length+' फोटो, सरकाकर देखें</p>':'')}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

['सभी','बाइक','स्कूटर','कार'].forEach(function(t){
var b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',t===type);
b.onclick=function(){type=t;[].forEach.call($('chips').children,function(c){c.setAttribute('aria-pressed',c===b)});render()};
$('chips').appendChild(b)});
$('q').oninput=render;
$('photo').onchange=function(){var fs=[].slice.call(this.files,0,8);$('pcount').textContent=fs.length?fs.length+' फोटो चुनी':'कोई फोटो नहीं चुनी';$('prev').innerHTML='';fs.forEach(function(f){var im=document.createElement('img');im.alt='';im.src=URL.createObjectURL(f);$('prev').appendChild(im)})};

function render(){
var q=$('q').value.toLowerCase().trim();
var list=all().filter(function(v){
return (type==='सभी'||v.type===type)&&(v.make+' '+v.model+' '+v.area).toLowerCase().indexOf(q)>-1});
$('count').textContent=list.length+' गाड़ियाँ';
$('grid').innerHTML=list.length?'':'<p class="empty">'+(all().length?'कोई गाड़ी नहीं मिली।':'अभी कोई गाड़ी नहीं है। पहली गाड़ी आप डालिए।')+'</p>';
list.forEach(function(v){
var c=document.createElement('button');c.className='card';
c.innerHTML='<div class="ph">'+thumb(v)+'</div><div class="info"><div class="price">'+inr(v.price)+'</div><div class="name">'+esc(v.make+' '+v.model)+'</div><div class="meta">'+esc(v.year+' · '+Number(v.km).toLocaleString('en-IN')+' km')+'<br>'+esc(v.area)+'</div></div>';
c.onclick=function(){show(v)};$('grid').appendChild(c)})}

function show(v){
var msg='नमस्ते, मुझे '+v.make+' '+v.model+' ('+v.year+') के बारे में जानना है।';
$('dbody').innerHTML='<button class="close" data-close aria-label="बंद करें">×</button>'+gallery(v)+'<h2>'+esc(v.make+' '+v.model)+'</h2><div class="price">'+inr(v.price)+'</div><p class="meta">'+esc(v.type+' · '+v.year+' · '+Number(v.km).toLocaleString('en-IN')+' km · '+v.area)+'</p><div class="acts"><a class="btn alt" href="tel:+'+encodeURIComponent(v.phone.replace(/\D/g,''))+'">कॉल करें</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+v.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg)+'">WhatsApp</a></div>';
$('detail').showModal()}

$('sellBtn').onclick=function(){$('sell').showModal()};
document.addEventListener('click',function(e){
if(e.target.closest('[data-close]')){e.target.closest('dialog').close()}
else if(e.target.tagName==='DIALOG'){e.target.close()}});

function resize(file,cb){
var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var s=Math.min(1,500/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.onerror=function(){cb('')};im.src=r.result};r.readAsDataURL(file)}

$('f').onsubmit=function(e){
e.preventDefault();
var fs=[].slice.call($('photo').files,0,8);
function done(imgs){
var p=$('phone').value.replace(/\D/g,'');if(p.length===10)p='91'+p;
mine.unshift({id:'u'+Date.now(),type:$('type').value,make:$('make').value.trim(),model:$('model').value.trim(),year:$('year').value.trim(),km:$('km').value.replace(/\D/g,''),price:$('price').value.replace(/\D/g,''),area:$('area').value.trim(),phone:p,imgs:(imgs||[]).filter(Boolean)});
try{localStorage.setItem('ygp-listings',JSON.stringify(mine))}catch(x){}
$('f').reset();$('prev').innerHTML='';$('pcount').textContent='कोई फोटो नहीं चुनी';$('sell').close();render()}
if(!fs.length){done([]);return}
var out=[],n=0;fs.forEach(function(f,i){resize(f,function(d){out[i]=d;if(++n===fs.length)done(out)})})};
render();
</script>
</body>
</html>
